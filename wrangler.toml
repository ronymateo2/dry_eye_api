name = "dry-eye-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set these in the Cloudflare dashboard or via wrangler secret put
# GOOGLE_CLIENT_ID = ""
# GOOGLE_CLIENT_SECRET = ""
# JWT_SECRET = ""
FRONTEND_URL = "https://dry-eye-web.ronymateo.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "weqe-db"
database_id = "025e31c9-e68c-49e5-ad71-724b3b882663"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "REMINDERS"
class_name = "ReminderDO"

# Rate limit del endpoint público /api/errors: 30 req/min por IP.
[[unsafe.bindings]]
name = "ERRORS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Rate limit de los callbacks OAuth (sin auth, hacen fetch saliente + writes): 15 req/min por IP.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 15, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderDO"]

[observability.logs]
enabled = true
invocation_logs = true


# 2. Configuración para STAGING
[env.staging]

[env.staging.vars]
FRONTEND_URL = "https://dry-eye-web-staging.ronymateo.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "weqe-db-prod"
database_id = "b8baa4ed-8e33-47a3-b60a-5d067e6a140e"

[[env.staging.durable_objects.bindings]]
name = "REMINDERS"
class_name = "ReminderDO"

[[env.staging.unsafe.bindings]]
name = "ERRORS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 15, period = 60 }

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderDO"]
